name: Edge shared helpers

# C5 — helpers partagés track + form-webhook (_shared/events_row.ts)

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/events_row.ts'
      - 'supabase/functions/_shared/events_row_test.ts'
      - 'supabase/functions/track/index.ts'
      - 'supabase/functions/form-webhook/index.ts'
      - 'scripts/deploy_track.py'
      - '.github/workflows/edge-shared-helpers.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/events_row.ts'
      - 'supabase/functions/track/index.ts'
      - 'supabase/functions/form-webhook/index.ts'

jobs:
  events-row:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno tests (_shared/events_row.ts)
        run: deno test supabase/functions/_shared/events_row_test.ts
