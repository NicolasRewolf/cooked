name: Tracker Test

# Rejoue le contrat tracker sur la source et sur son minifié, régénéré avec jsmin.
# Le minifié reste ignoré par Git ; jsdom est verrouillé dans tests/package-lock.json.

on:
  push:
    branches: [main]
    paths:
      - 'wix/**'
      - 'tests/tracker.test.js'
      - 'tests/package.json'
      - 'tests/package-lock.json'
      - 'scripts/minify-tracker.py'
      - 'contracts/doc_constants.json'
      - '.github/workflows/tracker-test.yml'
  pull_request:
    paths:
      - 'wix/**'
      - 'tests/tracker.test.js'
      - 'tests/package.json'
      - 'tests/package-lock.json'
      - 'scripts/minify-tracker.py'
      - 'contracts/doc_constants.json'
      - '.github/workflows/tracker-test.yml'

jobs:
  tracker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer jsmin
        run: pip install jsmin
      - name: Régénérer le minifié (gitignoré) — cliquet T-17 (pas d'ajout net au-dessus de 14 500)
        run: python3 scripts/minify-tracker.py
      - name: T-17 — pas de COOKED_DEBUG = true sur les fichiers Velo (a-08)
        run: |
          if grep -nE 'COOKED_DEBUG\s*=\s*true' wix/*.js; then echo '::error::COOKED_DEBUG = true dans un fichier Velo' ; exit 1; fi
          echo 'COOKED_DEBUG off'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Installer les dépendances verrouillées
        run: npm ci --prefix tests
      - name: Suite tracker (source + minifié)
        run: npm test --prefix tests
