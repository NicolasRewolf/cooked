name: Wix forms reconciliation

on:
  schedule:
    - cron: '10 7 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: "Jours Paris clos à comparer (1 à 93)"
        default: "28"
        required: false

concurrency:
  group: wix-forms-reconcile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .
      - name: Compare confirmed Wix submissions with Cooked daily counts
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RECONCILE_DAYS: ${{ inputs.days || '28' }}
        run: python3 scripts/wix_forms_reconcile.py --days "$RECONCILE_DAYS"
      - name: notify-failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -fsS -H "Title: Cooked rapprochement formulaires" -H "Priority: high" \
              -d "Rapprochement Wix/Cooked en échec : $RUN_URL" \
              "https://ntfy.sh/$NTFY_TOPIC" >/dev/null
          fi
