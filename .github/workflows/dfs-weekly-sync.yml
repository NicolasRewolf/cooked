name: DFS Weekly Sync

# Sprint 33+ (25/05/2026) — sync hebdo DataForSEO → Supabase
#
# Lit les top 500 keywords (union GSC 28j ∪ 90j) et alimente la table
# dfs_keyword_volume avec : search_volume mensuel France, CPC,
# competition, monthly_searches 12 mois.
#
# Volume mensuel bouge lentement → hebdomadaire suffit.
# Coût estimé : ~50 cents par run × 4 runs/mois = ~$2/mois.
#
# Secrets à configurer une fois dans GitHub
# (Settings → Secrets and variables → Actions → New repository secret) :
#   DFS_USERNAME           : login DataForSEO
#   DFS_PASSWORD           : password DataForSEO
#   SUPABASE_SECRET_KEY    : clé sb_secret_* du projet Cooked

on:
  schedule:
    # Lundi 07:00 UTC = 09:00 Paris en été. Volume mensuel = pas critique
    # de tomber pile à minute X.
    - cron: "0 7 * * 1"
  workflow_dispatch: # bouton "Run workflow" manuel

concurrency:
  group: dfs-weekly-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Unit tests (sanitize DFS)
        run: python3 -m pytest tests/test_dfs_common.py -q

      - name: Run DFS sync (top 500 keywords GSC → France)
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DFS_USERNAME: ${{ secrets.DFS_USERNAME }}
          DFS_PASSWORD: ${{ secrets.DFS_PASSWORD }}
        run: python3 scripts/dfs_sync.py --limit 500

      # T-11 (audit 02/07/2026) — notification push d'échec via ntfy. Inerte
      # tant que le secret NTFY_TOPIC n'est pas posé.
      - name: notify-failure
        if: failure()
        run: |
          if [ -n "${{ secrets.NTFY_TOPIC }}" ]; then
            curl -s \
              -H "Title: Cooked CI en échec" \
              -H "Priority: high" \
              -H "Tags: warning" \
              -d "Workflow « ${{ github.workflow }} » en échec (run #${{ github.run_number }}) — voir Actions : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" || true
          else
            echo "NTFY_TOPIC non configuré — notification push ignorée (inerte)."
          fi
