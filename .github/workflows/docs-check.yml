name: Docs constants (I13)

# T-14 — les constantes chiffrées, versions et objets cités par les docs vivants suivent
# contracts/doc_constants.json (lui-même comparé à la prod par prod-drift.yml).

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'contracts/doc_constants.json'
      - 'scripts/check_docs_constants.py'
      - '.github/workflows/docs-check.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'contracts/doc_constants.json'
      - 'scripts/check_docs_constants.py'

jobs:
  docs-constants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: I13 — docs vivants = doc_constants.json
        run: python3 scripts/check_docs_constants.py
