name: Dashboard access

# Session, allowlist, magic-link et redirections de la page de transition.

on:
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-contract.yml'
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-contract.yml'

jobs:
  dashboard-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-public-key
          DASHBOARD_ALLOWED_EMAILS: synthetic@example.invalid
