name: Dashboard contracts

# C9 + C4 — vitest lib/ + schémas Zod data/.
# T-13 — src/data/rpc-contract.test.ts confronte les schémas Zod à contracts/dashboard_rpc_columns.json
# (colonnes et nullabilité publiées par la prod).

on:
  pull_request:
    paths:
      - 'dashboard/**'
      - 'contracts/dashboard_rpc_columns.json'
      - '.github/workflows/dashboard-contract.yml'
  push:
    branches: [main]
    paths:
      - 'dashboard/src/data/**'
      - 'dashboard/src/lib/**'
      - 'dashboard/src/components/**'
      - 'contracts/dashboard_rpc_columns.json'
      - '.github/workflows/dashboard-contract.yml'

jobs:
  dashboard-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
