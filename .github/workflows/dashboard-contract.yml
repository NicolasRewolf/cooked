name: Dashboard contracts

# C9 — vitest sur lib/ (dates, momentum, trend, redirect, annotations).

on:
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-contract.yml'
  push:
    branches: [main]
    paths:
      - 'dashboard/src/lib/**'
      - 'dashboard/src/components/**'
      - '.github/workflows/dashboard-contract.yml'

jobs:
  dashboard-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
