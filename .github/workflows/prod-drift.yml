name: Prod drift (T-12)

# Compare la prod à la prod via le rôle lecture seule cooked_ci_ro.
# Secret requis : DATABASE_URL_RO (GitHub → Settings → Secrets).

on:
  schedule:
    - cron: '20 6 * * *' # 06:20 UTC ≈ 08:20 Paris
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/rpcs.sql'
      - 'contracts/rpc_snapshot_meta.json'
      - 'contracts/doc_constants.json'
      - 'scripts/check_prod_drift.py'
      - 'scripts/generate_dashboard_contracts.py'
      - 'contracts/dashboard_rpc_columns.json'
      - 'dashboard/src/data/rpc-schemas.ts'
      - 'dashboard/src/data/rpc-contract.test.ts'
      - 'contracts/normalize_vectors.json'
      - 'scripts/check_normalize_vectors.py'
      - 'scripts/secib_ingest.py'
      - 'src/cooked/secib.py'
      - 'scripts/generate_rpcs_sql.py'
      - '.github/workflows/prod-drift.yml'
  workflow_dispatch:

jobs:
  prod-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install psycopg2
        run: pip install psycopg2-binary requests
      - name: T-12 — drift prod ↔ repo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_RO }}
        run: |
          python3 scripts/check_prod_drift.py || {
            echo "::error::Si Network unreachable / IPv6 : DATABASE_URL_RO doit utiliser le pooler Session (IPv4), ex. postgresql://cooked_ci_ro.<PROJECT_REF>:…@aws-0-<REGION>.pooler.supabase.com:5432/postgres?sslmode=require"
            exit 1
          }
      - name: T-16 — vecteurs de normalisation SQL = Python (I12)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_RO }}
        run: python3 scripts/check_normalize_vectors.py
      - name: T-13 — contrat RPC dashboard régénéré depuis la prod + échantillons réels
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_RO }}
        run: python3 scripts/generate_dashboard_contracts.py --check --samples /tmp/dashboard_rpc_samples.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: T-13 — les réponses prod réelles passent les schémas Zod
        working-directory: dashboard
        env:
          DASHBOARD_RPC_SAMPLES: /tmp/dashboard_rpc_samples.json
        run: npm ci && npx vitest run src/data/rpc-contract.test.ts
