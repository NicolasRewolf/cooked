name: Wix taxonomy sync

# One complete public-site inventory is validated before a single database RPC.
# Public Wix visitor credentials are fetched in memory, never stored or logged.
# Only the Supabase write key is needed; failures leave publication unchanged.

on:
  schedule:
    - cron: "0 5 * * *" # inventaire quotidien avant l'ingestion GSC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = afficher le diff sans écrire"
        required: false
        default: "false"

concurrency:
  group: wix-taxonomy-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - run: pip install .
      - name: Sync page_taxonomy depuis les publications Wix
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 scripts/wix_taxonomy_sync.py --dry-run
          else
            python3 scripts/wix_taxonomy_sync.py
          fi
      - name: notify-failure
        if: failure()
        run: |
          if [ -n "${{ secrets.NTFY_TOPIC }}" ]; then
            curl -s -H "Title: Cooked CI en échec" -H "Priority: high" -H "Tags: warning" \
              -d "Workflow « ${{ github.workflow }} » en échec (run #${{ github.run_number }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" || true
          fi
