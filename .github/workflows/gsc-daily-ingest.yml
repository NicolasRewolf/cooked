name: GSC Daily Ingest

# Sprint 33 (22/05/2026) — cron quotidien GSC → Cooked
#
# Pourquoi GitHub Actions et pas pg_cron ?
#   pg_cron tourne dans Postgres : pas d'accès aux APIs externes (GSC).
#   Ce workflow exécute scripts/gsc_ingest.py qui parle à l'API Search
#   Console, puis upserte vers Supabase. Idempotent grâce aux clés
#   primaires composites (day, path) / (day, query) / (day, path, query).
#
# Fenêtre : --daily (= GSC_DAILY_MONTHS_BACK dans scripts/gsc_common.py).
# Google refine les données jusqu'à J-3 ; avec un seul mois les derniers jours
# d'un mois (ex. 30/06) n'étaient jamais ré-ingérés quand le run tombe le 1er
# du mois suivant — trou fermé par 2 mois couverts (testé en CI :
# tests/test_gsc_common.py). Upsert idempotent (PK composites).
#
# Secrets à configurer dans GitHub
# (Settings → Secrets and variables → Actions → New repository secret) :
#   GSC_CREDENTIALS_B64   : base64 du JSON service account GSC
#                           (créer via : base64 -w0 < gsc-credentials.json)
#   SUPABASE_SECRET_KEY   : clé sb_secret_* du projet Cooked

on:
  schedule:
    # 06:00 UTC quotidien (= 07:00 ou 08:00 Paris selon DST).
    # GSC publie typiquement les données J-3 vers 03:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch: # bouton "Run workflow" manuel

# Empêche 2 runs simultanés (évite gaspillage API quota)
concurrency:
  group: gsc-daily-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/requirements-gsc.txt"

      - name: Install dependencies
        run: pip install -r scripts/requirements-gsc.txt

      - name: Write GSC credentials from secret
        run: |
          mkdir -p "$RUNNER_TEMP/gsc"
          echo "${{ secrets.GSC_CREDENTIALS_B64 }}" | base64 -d > "$RUNNER_TEMP/gsc/credentials.json"
          chmod 600 "$RUNNER_TEMP/gsc/credentials.json"
          # Sanity check (sans logger le contenu)
          test -s "$RUNNER_TEMP/gsc/credentials.json" || { echo "credentials.json vide ou base64 invalide" >&2; exit 1; }

      - name: Run path-query ingest (mois courant + précédent)
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GSC_CREDENTIALS_PATH: ${{ runner.temp }}/gsc/credentials.json
        run: python3 scripts/gsc_ingest.py path-query --daily

      - name: Run query-page ingest (mois courant + précédent)
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GSC_CREDENTIALS_PATH: ${{ runner.temp }}/gsc/credentials.json
        run: python3 scripts/gsc_ingest.py query-page --daily

      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gsc/credentials.json"

      # T-11 (audit 02/07/2026) — notification push d'échec via ntfy. Inerte
      # tant que le secret NTFY_TOPIC n'est pas posé.
      - name: notify-failure
        if: failure()
        run: |
          if [ -n "${{ secrets.NTFY_TOPIC }}" ]; then
            curl -s \
              -H "Title: Cooked CI en échec" \
              -H "Priority: high" \
              -H "Tags: warning" \
              -d "Workflow « ${{ github.workflow }} » en échec (run #${{ github.run_number }}) — voir Actions : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" || true
          else
            echo "NTFY_TOPIC non configuré — notification push ignorée (inerte)."
          fi
