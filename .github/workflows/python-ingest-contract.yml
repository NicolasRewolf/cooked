name: Python ingest contracts

# C7 — pures GSC/DFS + cooked_store (sans credentials prod).
# T-16 — + SECIB (vecteurs de normalisation partagés), import Wix, GBP, taxonomie Wix.

on:
  pull_request:
    paths:
      - 'scripts/**.py'
      - 'tests/test_*.py'
      - 'tests/fixtures/**'
      - 'contracts/normalize_vectors.json'
      - '.github/workflows/python-ingest-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**.py'
      - 'tests/test_*.py'
      - 'contracts/normalize_vectors.json'

jobs:
  python-ingest-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-gsc.txt
      - name: Install test deps
        run: pip install pytest -r scripts/requirements-gsc.txt -r scripts/requirements-gbp.txt -r scripts/requirements-secib.txt
      - name: GSC + DFS + store unit tests
        run: |
          python3 -m pytest \
            tests/test_gsc_common.py \
            tests/test_dfs_common.py \
            tests/test_cooked_store.py \
            tests/test_wix_taxonomy_sync.py \
            tests/test_secib_ingest.py \
            tests/test_wix_forms_import.py \
            tests/test_gbp_ingest.py \
            -q
      - name: I12 — vecteurs de normalisation (Python ; SQL dans prod-drift)
        run: python3 scripts/check_normalize_vectors.py
