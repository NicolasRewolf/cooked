name: Python ingest contracts

# Contrats du socle GSC, stockage, inventaire Wix et rapprochement des formulaires.
# Tous les tests utilisent des données synthétiques, sans credentials prod.

on:
  pull_request:
    paths:
      - 'scripts/**.py'
      - 'src/cooked/**'
      - 'pyproject.toml'
      - 'Makefile'
      - 'tests/test_*.py'
      - 'tests/fixtures/**'
      - '.github/workflows/python-ingest-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**.py'
      - 'src/cooked/**'
      - 'pyproject.toml'
      - 'Makefile'
      - 'tests/test_*.py'

jobs:
  python-ingest-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test deps
        run: pip install ".[dev]"
      - name: Ingestion et gardes CI — tests locaux
        run: |
          python3 -m pytest \
            tests/test_gsc_common.py \
            tests/test_gsc_batch.py \
            tests/test_cooked_store.py \
            tests/test_wix_taxonomy_sync.py \
            tests/test_wix_forms_reconcile.py \
            tests/test_rpcs_sql_fresh.py \
            tests/test_migration_paris_date.py \
            tests/test_check_prod_command.py \
            -q
