name: Python ingest contracts

# Contrats du socle GSC, stockage, inventaire Wix et rapprochement des formulaires.
# Tous les tests utilisent des données synthétiques, sans credentials prod.

on:
  pull_request:
    paths:
      - 'scripts/**.py'
      - 'src/cooked/**'
      - 'pyproject.toml'
      - 'Makefile'
      - 'tests/test_*.py'
      - 'tests/fixtures/**'
      - 'contracts/canonical_path_vectors.json'
      - '.github/workflows/python-ingest-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**.py'
      - 'src/cooked/**'
      - 'pyproject.toml'
      - 'Makefile'
      - 'tests/test_*.py'
      - 'tests/fixtures/**'
      - 'contracts/canonical_path_vectors.json'
      - '.github/workflows/python-ingest-contract.yml'

jobs:
  python-ingest-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test deps
        run: pip install ".[dev]"
      - name: Ruff — erreurs et code inutilisé
        run: python3 -m ruff check src scripts tests
      - name: Ingestion et gardes CI — tests locaux
        run: python3 -m pytest
