[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cooked"
version = "0.0.0"
description = "Mesure first-party jplouton-avocat.fr — ingest et gardes CI"
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client>=2.100.0",
  "google-auth>=2.23.0",
  "google-auth-oauthlib>=1.1.0",
  "requests>=2.31.0",
  "supabase>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "jsmin",
  "psycopg2-binary",
]
math = [
  "numpy>=1.26",
  "scipy>=1.11",
  "networkx>=3.0",
  "statsmodels>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 2
src = ["src", "scripts", "tests"]
extend-exclude = ["dashboard", "wix", "supabase"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
