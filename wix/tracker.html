<!--
  COOKED — first-party SEO tracker (cookieless, RGPD-exempt)
  Version: Sprint 38 (2026-06-11) — form attribution via query params.
    FORM ATTRIBUTION v2 — Wix Forms V2 ne rend PAS les champs cachés dans
    le DOM de la page publiée (vérifié en prod le 11/06/2026 : payloads
    sans field:cooked_aid, 0 input cooked_* dans le DOM). Le seeding DOM
    du Sprint 37 (fillCkd/setNV) était donc mort-né : remplacé par
    exposeIds() — les ids sont exposés en query params (?cooked_aid=…&
    cooked_sid=…) via history.replaceState ; le masterPage.js Velo les lit
    (wixLocation.query) et les pose dans les forms via setFieldValues(),
    même rail que le page_source de public/faq-system.js (Rewolf).
    replaceState ne crée pas d'URL crawlable (jamais liée → pas d'impact
    SEO) ; les paths Cooked sont canonicalisés sans query (pas d'impact
    data). URL partagée portant l'aid d'autrui : le tracker écrase avec
    SES valeurs au premier pageview.
  (Sprint 37: execution guard window.__cookedLoaded — snippet embarqué 2×
    → clics dupliqués même-seconde ; batching {events:[…]} flush 30 s /
    10 events / pagehide, critiques immédiats, −60/70 % de requêtes ;
    fix double-tick flushExit)
  (Sprint 36: click_internal — attribution nav interne)
  (Sprint 35: cta_anchor_click ne compte plus le chrome UI)
  (Sprint 30: bfcache, SPA nav, placement & debounce fixes)
  (Sprint 28: session_id en localStorage — fix self-referral)
  (Sprint 26: version stamp props._v) (Sprint 22: anonymous_id stable)

  Events emitted (see Edge Function ALLOWED_EVENTS for the canonical list):
    pageview, scroll_depth, engagement_tick, web_vitals, page_exit,
    cta_phone_click, cta_booking_click, cta_anchor_click, click_internal,
    click_outbound.

  `form_submit` is server-side only and never flows through this tracker;
  it's inserted by the `form-webhook` Edge Function on every Wix Forms
  submission via Wix Automations. Sprint 37: the tracker now seeds the
  hidden fields the webhook reads for attribution.
-->
<script>
(function () {
  'use strict';

  // Sprint 37 — execution guard. Le snippet peut être embarqué plusieurs
  // fois (double entrée Custom Code constatée en prod le 09/06/2026).
  // Sans ce garde, chaque instance empile ses listeners → events dupliqués.
  if (window.__cookedLoaded) return;
  window.__cookedLoaded = true;

  var ENDPOINT             = '/_functions/track';
  var SESSION_TIMEOUT_MS   = 30 * 60 * 1000; // 30 min idle → new session
  var ENGAGEMENT_TICK_MS   = 10 * 1000;       // flush active-time every 10 s
  var IDLE_THRESHOLD_MS    = 30 * 1000;       // 30 s no input = idle
  var SCROLL_DEBOUNCE_MS   = 200;

  // Sprint 26 — version hash propagated in every event via props._v.
  // Allows monitoring to detect when a release has been correctly
  // published (`SELECT props->>'_v', COUNT(*) FROM events WHERE
  // occurred_at > now() - interval '1 hour' GROUP BY 1`). If a new
  // version label never appears after a Wix republish, the paste
  // failed or was truncated. Bump this string on every meaningful
  // tracker change.
  var COOKED_VERSION       = 'sprint38';

  function rid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

  // ==============================================================
  // Sprint 22 — stable anonymous_id stored in localStorage
  //
  // Previous design hashed IP+UA server-side. Wix Velo routes each
  // request through a different stateless worker, so the "IP" the
  // Edge Function sees is the worker's outbound IP — not the
  // visitor's. This caused 93 % of sessions to accumulate 6+ different
  // anonymous_ids (one per engagement_tick), completely breaking
  // visitor de-duplication.
  //
  // Fix: generate a random UUID once per browser/device, persist it
  // in localStorage under `_ckd_aid`. The Edge Function accepts it
  // directly if it looks valid; otherwise it falls back to the IP hash
  // (backward-compat for old events already stored).
  //
  // Privacy: a random UUID is not personal data and is RGPD-exempt —
  // it cannot be linked to an individual without additional context.
  // This is the same approach used by Plausible, Fathom, and Pirsch.
  // ==============================================================
  // Sprint 25 — closure cache. Without it, when localStorage is blocked
  // (Safari ITP strict, Firefox private "strict", privacy extensions —
  // ~5-10 % of visitors), the catch branch returned a fresh rid() on
  // every call. Since basePayload() reads getAnonymousId() on every
  // send(), one session generated 10+ different anonymous_ids — the
  // exact Sprint 22 bug re-introduced for a sub-population. Caching
  // the resolved id in a closure variable fixes it: one id per page
  // load even when localStorage throws.
  var _cachedAid = null;
  function getAnonymousId() {
    if (_cachedAid) return _cachedAid;
    try {
      var KEY = '_ckd_aid';
      var aid = localStorage.getItem(KEY);
      if (!aid || aid.length < 8) {
        aid = rid() + rid(); // ~28 chars of alphanumeric randomness
        localStorage.setItem(KEY, aid);
      }
      _cachedAid = aid;
      return aid;
    } catch (e) {
      // Sprint 37 — localStorage bloqué (Safari privé/Lockdown, constaté
      // en prod le 09/06) : fallback sessionStorage → l'aid reste stable
      // dans l'onglet (attribution intra-session correcte), au lieu d'un
      // id par chargement de page.
      try {
        var aid2 = sessionStorage.getItem('_ckd_aid');
        if (!aid2 || aid2.length < 8) {
          aid2 = rid() + rid();
          sessionStorage.setItem('_ckd_aid', aid2);
        }
        _cachedAid = aid2;
      } catch (e2) {
        _cachedAid = rid() + rid(); // dernier recours : par chargement
      }
      return _cachedAid;
    }
  }

  // ==============================================================
  // Sprint 30 — session_id persisted in localStorage with 30-min
  // sliding idle window.
  //
  // Previous design stored the session blob in sessionStorage, which
  // is per-tab and dropped on hard navigations. Wix Studio triggers
  // a hard navigation between certain pages (full page reload, JS
  // re-bootstrap); in some browser contexts the sessionStorage is
  // cleared, so the tracker on the next page would start a brand-new
  // session and capture `referrer = jplouton-avocat.fr` — producing
  // a fake "referral" channel of self-referrals (461 sessions / 7d
  // before the fix, ~10% of total traffic, with an inflated CR of
  // 21% since these "sessions" were already-engaged visitors).
  //
  // localStorage survives hard navigations and tab close/reopen, so
  // we now stitch the session correctly. The 30-min sliding idle
  // window is preserved: if `now - last > SESSION_TIMEOUT_MS`, we
  // mint a new session id even if the blob still exists. That keeps
  // "next-day visitor" semantics intact.
  //
  // Tradeoff: parallel tabs now share one session_id (used to be one
  // per tab). Acceptable — they share the same anonymous_id anyway,
  // and merging is the more honest count.
  // ==============================================================
  // Sprint 30 — debounce localStorage write to 5s minimum. Each event
  // (~35 per 5-min session) was triggering a setItem; on iOS Safari ITP
  // each write costs 0.5-1.5ms of main-thread sync I/O → ~35ms cumulative
  // jank on iPhone 8-era devices, sub-INP but felt. The 30-min sliding
  // timeout doesn't need ms precision — 5s drift is irrelevant.
  var _sessionLastWrite = 0;
  function getSessionId() {
    try {
      var KEY = '_ckd';
      var now = Date.now();
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.id && (now - s.last) < SESSION_TIMEOUT_MS) {
          s.last = now;
          if (now - _sessionLastWrite > 5000) {
            localStorage.setItem(KEY, JSON.stringify(s));
            _sessionLastWrite = now;
          }
          return s.id;
        }
      }
      var ns = { id: rid(), start: now, last: now };
      localStorage.setItem(KEY, JSON.stringify(ns));
      _sessionLastWrite = now;
      return ns.id;
    } catch (e) {
      // localStorage blocked (private mode, strict cookie blockers).
      // Best-effort fallback: try sessionStorage so at least pageviews
      // within a single tab stitch together.
      try {
        var raw2 = sessionStorage.getItem('_ckd');
        var now2 = Date.now();
        if (raw2) {
          var s2 = JSON.parse(raw2);
          if (s2 && s2.id && (now2 - s2.last) < SESSION_TIMEOUT_MS) {
            s2.last = now2;
            sessionStorage.setItem('_ckd', JSON.stringify(s2));
            return s2.id;
          }
        }
        var ns2 = { id: rid(), start: now2, last: now2 };
        sessionStorage.setItem('_ckd', JSON.stringify(ns2));
        return ns2.id;
      } catch (e2) { return rid(); }
    }
  }

  function parseQuery() {
    var out = {};
    var q = location.search.replace(/^\?/, '');
    if (!q) return out;
    q.split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i < 0) return;
      try {
        out[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
      } catch (e) {}
    });
    return out;
  }

  function basePayload() {
    var qp = parseQuery();
    return {
      anonymous_id:     getAnonymousId(),
      session_id:       getSessionId(),
      url:              location.href,
      path:             location.pathname || '/',
      title:            document.title || null,
      referrer:         document.referrer || null,
      utm_source:       qp.utm_source   || null,
      utm_medium:       qp.utm_medium   || null,
      utm_campaign:     qp.utm_campaign || null,
      utm_term:         qp.utm_term     || null,
      utm_content:      qp.utm_content  || null,
      viewport_width:   window.innerWidth  || 0,
      viewport_height: window.innerHeight || 0,
      occurred_at:     new Date().toISOString()
    };
  }

  // ==============================================================
  // Sprint 37 — batching. L'Edge /track accepte {events:[…]} (cap 50)
  // depuis toujours mais le tracker envoyait 1 POST par event :
  // engagement_tick seul = 60 % du trafic réseau (6,2 POST/session).
  // File d'attente : flush à 10 events, toutes les 5 s, au pagehide
  // (sendBeacon), et IMMÉDIATEMENT pour les events critiques (pageview,
  // clics, page_exit) pour garder la visibilité temps réel des contacts.
  // basePayload() est capturé à l'enqueue (pas au flush) pour que le path
  // reste correct lors des navigations SPA.
  // ==============================================================
  var B_MAX      = 10;
  // 30 s (pas 5) : engagement_tick part toutes les 10 s — un flush à 5 s
  // ferait voyager chaque tick seul (gain nul sur 60 % du trafic). À 30 s,
  // 3 ticks + scrolls/vitals voyagent ensemble. La latence ne touche que
  // les events non-critiques ; pagehide/visibilitychange flushent tout.
  var B_MS = 30000;
  var CRITICAL = ' pageview page_exit cta_phone_click cta_booking_click cta_anchor_click click_internal click_outbound ';
  var queue = [];

  function transmit(body) {
    if (navigator.sendBeacon) {
      try {
        var blob = new Blob([body], { type: 'application/json' });
        if (navigator.sendBeacon(ENDPOINT, blob)) return;
      } catch (e) {}
    }
    try {
      fetch(ENDPOINT, {
        method:    'POST',
        keepalive: true,
        headers:   { 'content-type': 'application/json' },
        body:      body
      });
    } catch (e) {}
  }

  function flushQ() {
    if (!queue.length) return;
    var batch = queue.splice(0, 50);
    transmit(JSON.stringify({ events: batch }));
    if (queue.length) flushQ(); // file > 50 (théorique)
  }

  function send(name, props) {
    var p = basePayload();
    p.name  = name;
    p.props = props || {};
    p.props._v = COOKED_VERSION; // Sprint 26 — version stamp for monitoring
    queue.push(p);
    if (CRITICAL.indexOf(' ' + name + ' ') >= 0 || queue.length >= B_MAX) flushQ();
  }

  setInterval(flushQ, B_MS);

  // ==============================================================
  // 1. Pageview (initial + SPA navigations)
  //
  // Wix Studio calls history.pushState/replaceState internally on many
  // micro-interactions (sticky-index clicks, anchor-menu scrolls, …),
  // with URLs that differ only by a trailing slash or by a transient
  // hash. Without normalization, those would each fire a fake pageview
  // + page_exit, completely polluting metrics. We compare a normalized
  // pathname (trailing slash stripped, no hash) — if it hasn't really
  // changed, we don't re-emit anything.
  // ==============================================================
  function normPC(p) {
    if (!p) return '/';
    if (p.length > 1 && p.charAt(p.length - 1) === '/') return p.slice(0, -1);
    return p;
  }
  var currentPath = normPC(location.pathname);
  function emitPageview() { send('pageview', {}); }

  emitPageview();

  function onPMC() {
    var newPath = normPC(location.pathname);
    if (newPath !== currentPath) {
      // Flush previous page's exit data first
      flushExit();
      // Sprint 30 — reset exitSent so the new SPA page can emit its own
      // page_exit. Previously this only reset on popstate (see
      // resetExitFlag handler), but Wix Studio uses pushState heavily,
      // and after pushState `exitSent` stayed true → page 2's exit was
      // silently dropped on tab close.
      exitSent = false;
      currentPath = newPath;
      // Reset per-page state
      scrollHits = { 25: false, 50: false, 75: false, 100: false };
      maxScroll  = 0;
      pageStart     = performance.now();
      activeMs      = 0;
      totAMs = 0;
      lastTick      = Date.now();
      vitals.lcp = 0; vitals.cls = 0; vitals.inp = 0; vitals.ttfb = 0;
      vitEm = { LCP: false, CLS: false, INP: false, TTFB: false };
      // Sprint 30 — disconnect & reattach PerformanceObservers so LCP/CLS
      // from page N don't leak into page N+1 (observers keep firing on
      // detached document otherwise). See attachVO() below.
      try { discVO(); } catch (e) {}
      try { attachVO(); } catch (e) {}
      emitPageview();
      // Sprint 38 — ré-expose les ids sur la nouvelle URL (la nav SPA
      // remplace la query). Pas de boucle : le replaceState interne
      // re-déclenche onPMC qui early-return (path inchangé).
      exposeIds();
    }
  }

  // Sprint 30 — bfcache restore handler. On iOS Safari, navigating back
  // (or forward) to a cached page fires `pageshow` with persisted=true.
  // Without this handler, `exitSent` stays true from the previous
  // pagehide → the next page_exit is silently dropped (full session
  // worth of metrics lost on every iOS back-nav). HTML spec §7.1.4.
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) {
      exitSent      = false;
      lastTick      = Date.now();     // bfcache pause invisible
      lastActivity  = Date.now();
      pageStart     = performance.now();
    }
  });

  window.addEventListener('popstate', onPMC);
  ['pushState', 'replaceState'].forEach(function (m) {
    var orig = history[m];
    if (typeof orig !== 'function') return;
    history[m] = function () {
      var ret = orig.apply(this, arguments);
      setTimeout(onPMC, 0);
      return ret;
    };
  });

  // ==============================================================
  // 2. Scroll depth (25 / 50 / 75 / 100 %)
  // ==============================================================
  var scrollHits = { 25: false, 50: false, 75: false, 100: false };
  var maxScroll  = 0;

  function compSP() {
    var doc      = document.documentElement;
    var body     = document.body;
    var scrolled = (window.scrollY || doc.scrollTop || 0) + window.innerHeight;
    var height   = Math.max(
      doc.scrollHeight, doc.offsetHeight,
      body ? body.scrollHeight : 0,
      body ? body.offsetHeight : 0
    );
    if (!height) return 0;
    return Math.min(100, Math.round((scrolled / height) * 100));
  }

  function onScroll() {
    var pct = compSP();
    if (pct > maxScroll) maxScroll = pct;
    [25, 50, 75, 100].forEach(function (t) {
      if (!scrollHits[t] && pct >= t) {
        scrollHits[t] = true;
        send('scroll_depth', { percent: t });
      }
    });
  }

  var scrollTimer;
  window.addEventListener('scroll', function () {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(onScroll, SCROLL_DEBOUNCE_MS);
  }, { passive: true });

  // ==============================================================
  // 3. Engagement (active time only — pauses on idle / hidden tab)
  // ==============================================================
  var lastActivity  = Date.now();
  var lastTick      = Date.now();
  var activeMs      = 0;
  var totAMs = 0;
  var pageStart     = performance.now();

  ['mousemove', 'keydown', 'scroll', 'touchstart', 'click'].forEach(function (ev) {
    window.addEventListener(ev, function () { lastActivity = Date.now(); }, { passive: true });
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      lastActivity = Date.now();
      lastTick     = Date.now();
    }
  });

  setInterval(function () {
    var now = Date.now();
    if (!document.hidden && (now - lastActivity) < IDLE_THRESHOLD_MS) {
      activeMs      += (now - lastTick);
      totAMs += (now - lastTick);
    }
    lastTick = now;
  }, 1000);

  setInterval(function () {
    if (activeMs > 0) {
      send('engagement_tick', { active_ms: activeMs });
      activeMs = 0;
    }
  }, ENGAGEMENT_TICK_MS);

  // ==============================================================
  // 4. Link click delegation
  //    tel:                       → cta_phone_click
  //    href="#xxx" / same-page#x  → cta_anchor_click (sticky index, FAQ, top)
  //    /honoraires-rendez-vous    → cta_booking_click
  //    other internal page        → click_internal (Sprint 36 — nav element
  //                                 attribution: placement + target_path)
  //    cross-origin               → click_outbound
  // ==============================================================
  var BKG_P = ['/honoraires-rendez-vous'];

  function normalizePath(p) {
    if (!p) return '';
    var s = String(p).toLowerCase();
    if (s.length > 1 && s.charAt(s.length - 1) === '/') s = s.slice(0, -1);
    return s;
  }

  function isBkg(pathname) {
    var n = normalizePath(pathname);
    for (var i = 0; i < BKG_P.length; i++) {
      if (n === normalizePath(BKG_P[i])) return true;
    }
    return false;
  }

  function placementOf(el) {
    // Sprint 30 — dropped [class*="FOOTER"] / [class*="HEADER"] substring
    // matchers. Wix Studio names body utility classes like
    // "wixui-rich-text-FOOTER_CTA" → a CTA in the middle of /honoraires-
    // rendez-vous was being classified as `placement='footer'`, biasing
    // per-placement conversion attribution. Stick to structural selectors.
    if (el.closest('footer, [role="contentinfo"], .wixui-footer')) {
      return 'footer';
    }
    if (el.closest('header, nav, [role="navigation"], .wixui-header')) {
      return 'header';
    }
    // Sticky / fixed container detection (Wix sticky bars, sticky indices,
    // "back to top" buttons, etc.). Walks up the DOM and inspects the
    // computed `position` of each ancestor. This widens the placement
    // taxonomy to {header, footer, sticky, body} — additive change, the
    // existing values are unaffected for non-sticky CTAs.
    try {
      var p = el.parentElement;
      var hops = 0;
      while (p && p !== document.body && hops < 12) {
        var pos = window.getComputedStyle(p).position;
        if (pos === 'sticky' || pos === 'fixed') return 'sticky';
        p = p.parentElement;
        hops++;
      }
    } catch (e) {}
    return 'body';
  }

  // ==============================================================
  // 4a. Anchor-noise guard (Sprint 35) — keep UI chrome out of
  //     cta_anchor_click.
  //
  // The sticky-fallback (§4c) treats *any* click inside a sticky/fixed
  // container as an in-page anchor CTA. A prod audit (03/06/2026) found
  // ~85-90 % of cta_anchor_click were chrome, in four families:
  //   1. Cookiebot consent banner (#CybotCookiebotDialog, fixed) — buttons
  //      ("Tout autoriser"/"Refuser"/"Personnaliser"/"Autoriser la
  //      sélection") AND clicks on the dialog body text. ~75 % on its own.
  //   2. Mobile menu / burger toggle ("Menu mobile - burger" / "Menu") — a
  //      <button> with no <a href>, so only a label match catches it.
  //   3. Main-nav links to other pages (Équipe, Mentions Légales, Accueil…)
  //      — a real in-page anchor always carries a #hash or a data-anchor;
  //      site nav never does (handled in §4c's link guard).
  //   4. Long-text dumps: when a click bubbles to a container with no inner
  //      button, label = its whole textContent — an inline <script>, a
  //      mega-menu, a phone-prefix list, the consent dialog body… Real
  //      labels are short (longest in prod: 78), so §4c drops labels ≥ 80.
  // (1)+(2)+short chrome labels → isAN(); (3) → §4c link guard;
  // (4) → §4c length cap. The consent *selector* in isAN catches
  // family 1 wholesale (buttons + body) regardless of label. Shared so the
  // primary handler (§4) and hashchange fallback (§4b) inherit (1)+(2).
  // ==============================================================
  var CHR_L = {
    'tout autoriser': 1, 'tout refuser': 1, 'refuser': 1,
    'autoriser la sélection': 1, 'autoriser la selection': 1,
    'personnaliser': 1, 'tout accepter': 1, 'accepter': 1,
    'continuer sans accepter': 1, 'enregistrer': 1, 'afficher les détails': 1,
    'menu': 1, 'menu mobile': 1, 'menu mobile - burger': 1,
    'fermer': 1, 'close': 1, 'recherche sur le site': 1
  };
  function isAN(el, label) {
    // Structural: the Cookiebot consent dialog / reopener widget. Its
    // buttons sit in a position:fixed dialog, so the sticky-fallback was
    // counting every consent tap as a micro-conversion. closest() walks
    // up from the deepest click target, so an inner <span> still matches.
    try {
      if (el && el.closest && el.closest(
        '#CybotCookiebotDialog,#CookiebotWidget,[id^="CybotCookiebot"],[class*="CybotCookiebot"]'
      )) return true;
    } catch (e) {}
    // Label denylist — locale-stable insurance that survives a future
    // consent-tool swap (which would break the selector above), and the
    // only way to catch the burger toggle (no <a href>, so §4c's link
    // guard can't see it). Exact match on the trimmed, lowercased label.
    var lc = (label || '').toLowerCase().trim();
    if (!lc) return false;
    if (lc.indexOf('burger') !== -1) return true;
    return CHR_L[lc] === 1;
  }

  // Track the most-recently-clicked element so the hashchange fallback
  // (below) can pull a sensible `anchor` label from it. Wix Studio's
  // anchor-menu widget triggers scroll-to-section via JS (location.hash
  // assignment) rather than emitting a real <a href="#x"> click, so the
  // primary click listener never fires for those elements.
  var lcEl = null;
  var lcaAt = 0;
  document.addEventListener('click', function (e) { lcEl = e.target; }, true);

  document.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el.nodeType === 1 && el.tagName !== 'A') el = el.parentElement;
    if (!el || !el.href) return;

    var rawHref = el.getAttribute('href') || '';
    // Prefer aria-label when present — accessible name reflects the
    // semantic intent better than textContent for icon-only buttons
    // (e.g. Wix sticky bars where the visible label is "Read More").
    var anchor = (el.getAttribute('aria-label') || el.textContent || '').trim().slice(0, 100);

    if (rawHref.indexOf('tel:') === 0) {
      send('cta_phone_click', {
        phone:     rawHref.slice(4).replace(/\s+/g, ''),
        anchor:    anchor,
        placement: placementOf(el)
      });
      return;
    }

    // In-page anchor click (sticky index, FAQ jump, back-to-top, …).
    // Hash-only hrefs like "#section" are intercepted here BEFORE we try
    // to parse them as full URLs. We skip the pure "#" no-op case.
    if (rawHref.charAt(0) === '#' && rawHref.length > 1) {
      if (isAN(el, anchor)) return; // consent / menu chrome, not an anchor
      lcaAt = Date.now();
      send('cta_anchor_click', {
        target_section: rawHref.slice(1).slice(0, 200),
        anchor:         anchor,
        placement:      placementOf(el),
        source:         'click'
      });
      return;
    }

    try {
      var u = new URL(el.href);
      if (u.hostname === location.hostname) {
        // Same-page anchor — two shapes Wix can produce:
        //   1. Classic:     href="/current-path#section"   → u.hash filled
        //   2. Wix native:  href="/current-path" + data-anchor="anchors-xxx"
        //                   (Wix scrolls programmatically; never sets #)
        // The data-anchor attribute (`el.dataset.anchor`) is set by the
        // Wix anchor-menu and section-navigator widgets — it's the
        // reliable signature we need.
        if (normalizePath(u.pathname) === normalizePath(location.pathname)) {
          var dataAnchor = (el.getAttribute('data-anchor') || el.dataset && el.dataset.anchor || '').toString();
          if (u.hash || dataAnchor) {
            var section;
            if (u.hash) {
              section = u.hash.replace(/^#/, '').slice(0, 200);
            } else if (anchor) {
              // Slugify the visible label so target_section is human-
              // readable ("accompagnement-immediat") rather than the
              // opaque Wix ID ("anchors-m6fkbsmm4").
              section = slugify(anchor) || dataAnchor.slice(0, 200);
            } else {
              section = dataAnchor.slice(0, 200);
            }
            if (isAN(el, anchor)) return; // consent / menu chrome, not an anchor
            lcaAt = Date.now();
            send('cta_anchor_click', {
              target_section: section,
              anchor:         anchor,
              placement:      placementOf(el),
              source:         'click',
              data_anchor:    dataAnchor || null
            });
            return;
          }
        }
        // Cross-page internal navigation. /honoraires-rendez-vous is the
        // booking funnel (its own micro-conversion); every OTHER internal
        // link is captured as click_internal (Sprint 36) so we know which
        // UI element drove each page-to-page hop toward a conversion —
        // disambiguated by `placement` (header / footer / sticky / body).
        // Self-links (same path, no #hash/data-anchor) are skipped: the
        // pageview already records arrival, there's no navigation.
        if (isBkg(u.pathname)) {
          send('cta_booking_click', {
            anchor:      anchor,
            placement:   placementOf(el),
            target_path: normalizePath(u.pathname),
            href:        el.href
          });
        } else if (normalizePath(u.pathname) !== normalizePath(location.pathname)) {
          send('click_internal', {
            target_path: normalizePath(u.pathname),
            anchor:      anchor,
            placement:   placementOf(el),
            href:        el.href
          });
        }
        return;
      }

      if (u.hostname) {
        send('click_outbound', {
          href:     el.href,
          hostname: u.hostname,
          anchor:   anchor
        });
      }
    } catch (err) {}
  }, true);

  // ==============================================================
  // 4c. Sticky-container click fallback for Wix anchor-menu widget
  //
  // Wix Studio's anchor menu renders as <button>/<div> elements that
  // scroll programmatically (no <a href="#x">, no hash update). Detect
  // them positionally: any click inside a sticky/fixed-positioned
  // container that wasn't already classified by the primary handler
  // (phone, booking, outbound) is treated as an anchor click. The
  // visible text becomes the `target_section`.
  //
  // Guards:
  //   - Skip if the primary handler just fired cta_anchor_click (<200ms)
  //   - Skip if the click is on a tel: / booking / outbound link
  //     (those are owned by the primary handler)
  //   - Skip if no text label can be extracted (avoids empty noise)
  // ==============================================================
  function slugify(s) {
    return String(s || '')
      .toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 200);
  }

  document.addEventListener('click', function (e) {
    if (Date.now() - lcaAt < 200) return;

    var el = e.target;
    if (!el || el.nodeType !== 1) return;

    // Skip clicks the primary handler owns (tel:, booking, outbound).
    try {
      var aAncestor = el.closest('a[href]');
      if (aAncestor) {
        var href = aAncestor.getAttribute('href') || '';
        if (href.indexOf('tel:') === 0) return;
        if (href.indexOf('mailto:') === 0) return;
        var u2 = null;
        try { u2 = new URL(aAncestor.href); } catch (e2) {}
        if (u2 && u2.hostname && u2.hostname !== location.hostname) return;
        if (isBkg((u2 && u2.pathname) || '')) return;
        // A plain same-origin link with no #hash and no data-anchor is
        // site-nav chrome (Accueil, Équipe, Mentions Légales…), not an
        // in-page anchor. The anchor-menu widget this fallback targets
        // uses buttons (no <a>) or same-page #/data-anchor links, so a
        // genuine anchor CTA always has one of those and is never dropped.
        var da2 = (aAncestor.getAttribute('data-anchor') ||
                   (aAncestor.dataset && aAncestor.dataset.anchor) || '');
        if (u2 && !u2.hash && !da2) return;
      }
    } catch (e3) {}

    // Must be inside a sticky/fixed container.
    var inSticky = false;
    try {
      var p = el, hops = 0;
      while (p && p !== document.body && hops < 15) {
        var pos = window.getComputedStyle(p).position;
        if (pos === 'sticky' || pos === 'fixed') { inSticky = true; break; }
        p = p.parentElement; hops++;
      }
    } catch (e4) {}
    if (!inSticky) return;

    // Find the closest interactive-like element to extract a label.
    var interactive = el;
    for (var i = 0; i < 6 && interactive && interactive.nodeType === 1; i++) {
      var tag = interactive.tagName;
      var role = interactive.getAttribute && interactive.getAttribute('role');
      if (tag === 'A' || tag === 'BUTTON' || role === 'button' || role === 'link') break;
      interactive = interactive.parentElement;
    }
    if (!interactive || interactive.nodeType !== 1) interactive = el;

    var label = (
      (interactive.getAttribute && interactive.getAttribute('aria-label')) ||
      interactive.textContent ||
      ''
    ).trim().slice(0, 100);
    if (!label) return;
    // Sprint 35 — a label ≥ 80 chars is not a button/section name; it's the
    // textContent of a container the click bubbled to (inline <script>,
    // mega-menu dump, consent dialog body, phone-prefix list, Wix link
    // panel). Real anchor labels are short (longest observed in prod: 78).
    if (label.length >= 80) return;
    if (isAN(el, label)) return; // consent banner / burger / menu chrome

    var slug = slugify(label);
    if (!slug) return;

    lcaAt = Date.now();
    send('cta_anchor_click', {
      target_section: slug,
      anchor:         label,
      placement:      'sticky',
      source:         'sticky-fallback'
    });
  }, false); // bubble — primary capture-phase handler claims its own first

  // ==============================================================
  // 4b. Hashchange fallback for anchor menus
  //
  // Wix Studio's "anchor menu" widget (and similar custom-coded sticky
  // indices) scroll to a section by assigning location.hash via JS,
  // without dispatching a click on a real <a href="#x">. The click
  // handler above never sees those interactions. The DOM `hashchange`
  // event, however, fires unconditionally — so we use it as a catch-all.
  //
  // Dedup: if the click handler above just sent a cta_anchor_click in
  // the last 500 ms, skip this one to avoid double-counting.
  // ==============================================================
  var lastHash = location.hash || '';
  window.addEventListener('hashchange', function () {
    if (Date.now() - lcaAt < 500) {
      lastHash = location.hash || '';
      return;
    }
    var newHash = location.hash || '';
    if (newHash === lastHash) return;
    lastHash = newHash;
    var section = newHash.replace(/^#/, '').slice(0, 200);
    if (!section) return;

    var anchor = null;
    var placement = 'unknown';
    if (lcEl && lcEl.nodeType === 1) {
      try {
        var src = lcEl;
        // Walk up a couple of hops to find an element with an
        // accessible label (the actual click target is often a deep
        // inner <span> or <svg>).
        for (var i = 0; i < 4 && src && src.nodeType === 1; i++) {
          var lbl = src.getAttribute && (src.getAttribute('aria-label') || src.textContent);
          if (lbl && lbl.trim()) { anchor = lbl.trim().slice(0, 100); break; }
          src = src.parentElement;
        }
        placement = placementOf(lcEl);
      } catch (e) {}
    }
    if (isAN(lcEl, anchor)) return; // consent / menu chrome
    send('cta_anchor_click', {
      target_section: section,
      anchor:         anchor,
      placement:      placement,
      source:         'hashchange'
    });
  });

  // ==============================================================
  // 5. Core Web Vitals — LCP, CLS, INP, TTFB (p75 in SQL views)
  // ==============================================================
  var vitals         = { lcp: 0, cls: 0, inp: 0, ttfb: 0 };
  var vitEm  = { LCP: false, CLS: false, INP: false, TTFB: false };

  function emitVital(metric, value) {
    if (vitEm[metric]) return;
    vitEm[metric] = true;
    send('web_vitals', { metric: metric, value: Math.round(value * 100) / 100 });
  }

  // TTFB (one-shot, not observer-based)
  try {
    var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if (nav && nav.responseStart > 0) {
      vitals.ttfb = nav.responseStart;
      emitVital('TTFB', vitals.ttfb);
    }
  } catch (e) {}

  // Sprint 30 — wrap LCP / CLS / INP observers in (re)attachable helpers
  // so they can be disconnected on SPA navigation. Previously the
  // observers stayed attached to the detached document and continued
  // writing into the new page's `vitals` object, leaking metrics from
  // page N into page N+1. See onPMC() above.
  var lcpObs = null, clsObs = null, inpObs = null;
  var clsSV   = 0;
  var clsSE = [];

  function attachVO() {
    if (typeof PerformanceObserver === 'undefined') return;

    // LCP
    try {
      lcpObs = new PerformanceObserver(function (list) {
        var entries = list.getEntries();
        if (entries.length) vitals.lcp = entries[entries.length - 1].startTime;
      });
      lcpObs.observe({ type: 'largest-contentful-paint', buffered: true });
    } catch (e) {}

    // CLS — reset session-window state each (re)attach
    clsSV   = 0;
    clsSE = [];
    try {
      clsObs = new PerformanceObserver(function (list) {
        list.getEntries().forEach(function (entry) {
          if (entry.hadRecentInput) return;
          var first = clsSE[0];
          var last  = clsSE[clsSE.length - 1];
          if (
            clsSV &&
            entry.startTime - last.startTime < 1000 &&
            entry.startTime - first.startTime < 5000
          ) {
            clsSV += entry.value;
            clsSE.push(entry);
          } else {
            clsSV   = entry.value;
            clsSE = [entry];
          }
          if (clsSV > vitals.cls) vitals.cls = clsSV;
        });
      });
      clsObs.observe({ type: 'layout-shift', buffered: true });
    } catch (e) {}

    // INP — Sprint 30 : durationThreshold raised from 16 to 40 (spec).
    // At 16 the observer silently returned nothing on most engines, so
    // we were emitting LCP/CLS but not INP for the vast majority of pages.
    try {
      inpObs = new PerformanceObserver(function (list) {
        list.getEntries().forEach(function (entry) {
          if (entry.duration > vitals.inp) vitals.inp = entry.duration;
        });
      });
      inpObs.observe({ type: 'event', buffered: true, durationThreshold: 40 });
    } catch (e) {}
  }

  function discVO() {
    try { lcpObs && lcpObs.disconnect(); } catch (e) {}
    try { clsObs && clsObs.disconnect(); } catch (e) {}
    try { inpObs && inpObs.disconnect(); } catch (e) {}
    lcpObs = clsObs = inpObs = null;
  }

  // Initial attach for the first page load.
  attachVO();

  function flushVitals() {
    if (vitals.lcp)  emitVital('LCP', vitals.lcp);
    if (vitals.cls)  emitVital('CLS', vitals.cls);
    if (vitals.inp)  emitVital('INP', vitals.inp);
  }

  // ==============================================================
  // 6. Page exit — duration, max scroll, vitals flush
  // ==============================================================
  var exitSent = false;
  function flushExit() {
    if (exitSent) return;
    exitSent = true;

    if (activeMs > 0) {
      send('engagement_tick', { active_ms: activeMs });
      activeMs = 0;
    }
    flushVitals();

    var now2 = Date.now();
    if (!document.hidden && (now2 - lastActivity) < IDLE_THRESHOLD_MS) {
      totAMs += (now2 - lastTick);
    }
    lastTick = now2; // Sprint 37 — évite le double comptage du résiduel
    var duration = Math.round(totAMs / 1000);
    send('page_exit', {
      duration_seconds: duration,
      max_scroll:       maxScroll
    });
    flushQ(); // Sprint 37 — vider la file avant la mort de la page
  }

  function resetExitFlag() { exitSent = false; }
  window.addEventListener('popstate', resetExitFlag);

  window.addEventListener('pagehide',    flushExit);
  window.addEventListener('beforeunload', flushExit);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) flushExit();
  });

  // ==============================================================
  // 7. Sprint 38 — form attribution : ids exposés en query params
  //
  // Wix Forms V2 ne rend pas les champs cachés dans le DOM de la page
  // publiée (vérifié en prod le 11/06/2026 : 0 input cooked_*, payloads
  // webhook sans field:cooked_aid) : le seeding DOM du Sprint 37
  // (fillCkd/setNV) ne pouvait pas fonctionner. À la place :
  // cooked_aid/cooked_sid sont exposés dans l'URL (history.replaceState) ;
  // le masterPage.js Velo les lit via wixLocation.query et les pose dans
  // les champs cachés des forms via setFieldValues() — même rail que le
  // page_source de public/faq-system.js. Le webhook form-webhook v10 lit
  // ensuite field:cooked_aid / field:cooked_sid, inchangé.
  //
  // - replaceState : URL jamais liée → jamais crawlée (pas d'impact SEO) ;
  //   les paths Cooked sont canonicalisés sans query (pas d'impact data).
  // - URL partagée portant l'aid d'un autre visiteur : écrasée par les
  //   valeurs locales au premier pageview (q.set inconditionnel).
  // - Ré-exposé à chaque nav SPA (cf. onPMC) : la query suit la page.
  // - Vieux navigateurs sans URLSearchParams : catch silencieux (pas
  //   d'attribution hidden_field, le fallback temporal du webhook reste).
  // ==============================================================
  function exposeIds() {
    try {
      var q = new URLSearchParams(location.search);
      var aid = getAnonymousId(), sid = getSessionId();
      if (q.get('cooked_aid') === aid && q.get('cooked_sid') === sid) return;
      q.set('cooked_aid', aid);
      q.set('cooked_sid', sid);
      history.replaceState(history.state, '', location.pathname + '?' + q.toString() + location.hash);
    } catch (e) {}
  }
  exposeIds();
})();
</script>
