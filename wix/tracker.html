<!--
  COOKED — first-party SEO tracker (cookieless, RGPD-exempt)
  Version: Sprint 19 (2026-05-13) — Wix anchor-menu tracking + pageview spam fix

  Events emitted (see Edge Function ALLOWED_EVENTS for the canonical list):
    pageview, scroll_depth, engagement_tick, web_vitals, page_exit,
    cta_phone_click, cta_booking_click, cta_anchor_click, click_outbound.

  `form_submit` is server-side only and never flows through this tracker;
  it's inserted by the `form-webhook` Edge Function on every Wix Forms
  submission via Wix Automations.
-->
<script>
(function () {
  'use strict';

  var ENDPOINT             = '/_functions/track';
  var SESSION_TIMEOUT_MS   = 30 * 60 * 1000; // 30 min idle → new session
  var ENGAGEMENT_TICK_MS   = 10 * 1000;       // flush active-time every 10 s
  var IDLE_THRESHOLD_MS    = 30 * 1000;       // 30 s no input = idle
  var SCROLL_DEBOUNCE_MS   = 200;

  function rid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

  // ==============================================================
  // Sprint 22 — stable anonymous_id stored in localStorage
  //
  // Previous design hashed IP+UA server-side. Wix Velo routes each
  // request through a different stateless worker, so the "IP" the
  // Edge Function sees is the worker's outbound IP — not the
  // visitor's. This caused 93 % of sessions to accumulate 6+ different
  // anonymous_ids (one per engagement_tick), completely breaking
  // visitor de-duplication.
  //
  // Fix: generate a random UUID once per browser/device, persist it
  // in localStorage under `_ckd_aid`. The Edge Function accepts it
  // directly if it looks valid; otherwise it falls back to the IP hash
  // (backward-compat for old events already stored).
  //
  // Privacy: a random UUID is not personal data and is RGPD-exempt —
  // it cannot be linked to an individual without additional context.
  // This is the same approach used by Plausible, Fathom, and Pirsch.
  // ==============================================================
  function getAnonymousId() {
    try {
      var KEY = '_ckd_aid';
      var aid = localStorage.getItem(KEY);
      if (!aid || aid.length < 8) {
        aid = rid() + rid(); // ~28 chars of alphanumeric randomness
        localStorage.setItem(KEY, aid);
      }
      return aid;
    } catch (e) {
      // localStorage blocked (private mode with strict settings, etc.)
      // Fall back to a per-session random ID — still prevents same-session
      // drift even if it won't persist across sessions.
      return rid();
    }
  }

  function getSessionId() {
    try {
      var raw = sessionStorage.getItem('_ckd');
      var now = Date.now();
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.id && (now - s.last) < SESSION_TIMEOUT_MS) {
          s.last = now;
          sessionStorage.setItem('_ckd', JSON.stringify(s));
          return s.id;
        }
      }
      var ns = { id: rid(), start: Date.now(), last: Date.now() };
      sessionStorage.setItem('_ckd', JSON.stringify(ns));
      return ns.id;
    } catch (e) { return rid(); }
  }

  function parseQuery() {
    var out = {};
    var q = location.search.replace(/^\?/, '');
    if (!q) return out;
    q.split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i < 0) return;
      try {
        out[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
      } catch (e) {}
    });
    return out;
  }

  function basePayload() {
    var qp = parseQuery();
    return {
      anonymous_id:     getAnonymousId(),
      session_id:       getSessionId(),
      url:              location.href,
      path:             location.pathname || '/',
      title:            document.title || null,
      referrer:         document.referrer || null,
      utm_source:       qp.utm_source   || null,
      utm_medium:       qp.utm_medium   || null,
      utm_campaign:     qp.utm_campaign || null,
      utm_term:         qp.utm_term     || null,
      utm_content:      qp.utm_content  || null,
      viewport_width:   window.innerWidth  || 0,
      viewport_height: window.innerHeight || 0,
      occurred_at:     new Date().toISOString()
    };
  }

  function send(name, props) {
    var p = basePayload();
    p.name  = name;
    p.props = props || {};
    var body = JSON.stringify(p);

    if (navigator.sendBeacon) {
      try {
        var blob = new Blob([body], { type: 'application/json' });
        if (navigator.sendBeacon(ENDPOINT, blob)) return;
      } catch (e) {}
    }
    try {
      fetch(ENDPOINT, {
        method:    'POST',
        keepalive: true,
        headers:   { 'content-type': 'application/json' },
        body:      body
      });
    } catch (e) {}
  }

  // ==============================================================
  // 1. Pageview (initial + SPA navigations)
  //
  // Wix Studio calls history.pushState/replaceState internally on many
  // micro-interactions (sticky-index clicks, anchor-menu scrolls, …),
  // with URLs that differ only by a trailing slash or by a transient
  // hash. Without normalization, those would each fire a fake pageview
  // + page_exit, completely polluting metrics. We compare a normalized
  // pathname (trailing slash stripped, no hash) — if it hasn't really
  // changed, we don't re-emit anything.
  // ==============================================================
  function normalizePathForCompare(p) {
    if (!p) return '/';
    if (p.length > 1 && p.charAt(p.length - 1) === '/') return p.slice(0, -1);
    return p;
  }
  var currentPath = normalizePathForCompare(location.pathname);
  function emitPageview() { send('pageview', {}); }

  emitPageview();

  function onPathMaybeChanged() {
    var newPath = normalizePathForCompare(location.pathname);
    if (newPath !== currentPath) {
      // Flush previous page's exit data first
      flushExit();
      currentPath = newPath;
      // Reset per-page state
      scrollHits = { 25: false, 50: false, 75: false, 100: false };
      maxScroll  = 0;
      pageStart     = performance.now();
      activeMs      = 0;
      totalActiveMs = 0;
      lastTick      = Date.now();
      vitals.lcp = 0; vitals.cls = 0; vitals.inp = 0; vitals.ttfb = 0;
      vitalsEmitted = { LCP: false, CLS: false, INP: false, TTFB: false };
      emitPageview();
    }
  }

  window.addEventListener('popstate', onPathMaybeChanged);
  ['pushState', 'replaceState'].forEach(function (m) {
    var orig = history[m];
    if (typeof orig !== 'function') return;
    history[m] = function () {
      var ret = orig.apply(this, arguments);
      setTimeout(onPathMaybeChanged, 0);
      return ret;
    };
  });

  // ==============================================================
  // 2. Scroll depth (25 / 50 / 75 / 100 %)
  // ==============================================================
  var scrollHits = { 25: false, 50: false, 75: false, 100: false };
  var maxScroll  = 0;

  function computeScrollPct() {
    var doc      = document.documentElement;
    var body     = document.body;
    var scrolled = (window.scrollY || doc.scrollTop || 0) + window.innerHeight;
    var height   = Math.max(
      doc.scrollHeight, doc.offsetHeight,
      body ? body.scrollHeight : 0,
      body ? body.offsetHeight : 0
    );
    if (!height) return 0;
    return Math.min(100, Math.round((scrolled / height) * 100));
  }

  function onScroll() {
    var pct = computeScrollPct();
    if (pct > maxScroll) maxScroll = pct;
    [25, 50, 75, 100].forEach(function (t) {
      if (!scrollHits[t] && pct >= t) {
        scrollHits[t] = true;
        send('scroll_depth', { percent: t });
      }
    });
  }

  var scrollTimer;
  window.addEventListener('scroll', function () {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(onScroll, SCROLL_DEBOUNCE_MS);
  }, { passive: true });

  // ==============================================================
  // 3. Engagement (active time only — pauses on idle / hidden tab)
  // ==============================================================
  var lastActivity  = Date.now();
  var lastTick      = Date.now();
  var activeMs      = 0;
  var totalActiveMs = 0;
  var pageStart     = performance.now();

  ['mousemove', 'keydown', 'scroll', 'touchstart', 'click'].forEach(function (ev) {
    window.addEventListener(ev, function () { lastActivity = Date.now(); }, { passive: true });
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      lastActivity = Date.now();
      lastTick     = Date.now();
    }
  });

  setInterval(function () {
    var now = Date.now();
    if (!document.hidden && (now - lastActivity) < IDLE_THRESHOLD_MS) {
      activeMs      += (now - lastTick);
      totalActiveMs += (now - lastTick);
    }
    lastTick = now;
  }, 1000);

  setInterval(function () {
    if (activeMs > 0) {
      send('engagement_tick', { active_ms: activeMs });
      activeMs = 0;
    }
  }, ENGAGEMENT_TICK_MS);

  // ==============================================================
  // 4. Link click delegation
  //    tel:                       → cta_phone_click
  //    href="#xxx" / same-page#x  → cta_anchor_click (sticky index, FAQ, top)
  //    /honoraires-rendez-vous    → cta_booking_click
  //    cross-origin               → click_outbound
  // ==============================================================
  var BOOKING_TARGET_PATHS = ['/honoraires-rendez-vous'];

  function normalizePath(p) {
    if (!p) return '';
    var s = String(p).toLowerCase();
    if (s.length > 1 && s.charAt(s.length - 1) === '/') s = s.slice(0, -1);
    return s;
  }

  function isBookingTarget(pathname) {
    var n = normalizePath(pathname);
    for (var i = 0; i < BOOKING_TARGET_PATHS.length; i++) {
      if (n === normalizePath(BOOKING_TARGET_PATHS[i])) return true;
    }
    return false;
  }

  function placementOf(el) {
    if (el.closest('footer, [role="contentinfo"], .wixui-footer, [class*="FOOTER"]')) {
      return 'footer';
    }
    if (el.closest('header, nav, [role="navigation"], .wixui-header, [class*="HEADER"]')) {
      return 'header';
    }
    // Sticky / fixed container detection (Wix sticky bars, sticky indices,
    // "back to top" buttons, etc.). Walks up the DOM and inspects the
    // computed `position` of each ancestor. This widens the placement
    // taxonomy to {header, footer, sticky, body} — additive change, the
    // existing values are unaffected for non-sticky CTAs.
    try {
      var p = el.parentElement;
      var hops = 0;
      while (p && p !== document.body && hops < 12) {
        var pos = window.getComputedStyle(p).position;
        if (pos === 'sticky' || pos === 'fixed') return 'sticky';
        p = p.parentElement;
        hops++;
      }
    } catch (e) {}
    return 'body';
  }

  // Track the most-recently-clicked element so the hashchange fallback
  // (below) can pull a sensible `anchor` label from it. Wix Studio's
  // anchor-menu widget triggers scroll-to-section via JS (location.hash
  // assignment) rather than emitting a real <a href="#x"> click, so the
  // primary click listener never fires for those elements.
  var lastClickedEl = null;
  var lastClickAnchorAt = 0;
  document.addEventListener('click', function (e) { lastClickedEl = e.target; }, true);

  document.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el.nodeType === 1 && el.tagName !== 'A') el = el.parentElement;
    if (!el || !el.href) return;

    var rawHref = el.getAttribute('href') || '';
    // Prefer aria-label when present — accessible name reflects the
    // semantic intent better than textContent for icon-only buttons
    // (e.g. Wix sticky bars where the visible label is "Read More").
    var anchor = (el.getAttribute('aria-label') || el.textContent || '').trim().slice(0, 100);

    if (rawHref.indexOf('tel:') === 0) {
      send('cta_phone_click', {
        phone:     rawHref.slice(4).replace(/\s+/g, ''),
        anchor:    anchor,
        placement: placementOf(el)
      });
      return;
    }

    // In-page anchor click (sticky index, FAQ jump, back-to-top, …).
    // Hash-only hrefs like "#section" are intercepted here BEFORE we try
    // to parse them as full URLs. We skip the pure "#" no-op case.
    if (rawHref.charAt(0) === '#' && rawHref.length > 1) {
      lastClickAnchorAt = Date.now();
      send('cta_anchor_click', {
        target_section: rawHref.slice(1).slice(0, 200),
        anchor:         anchor,
        placement:      placementOf(el),
        source:         'click'
      });
      return;
    }

    try {
      var u = new URL(el.href);
      if (u.hostname === location.hostname) {
        // Same-page anchor — two shapes Wix can produce:
        //   1. Classic:     href="/current-path#section"   → u.hash filled
        //   2. Wix native:  href="/current-path" + data-anchor="anchors-xxx"
        //                   (Wix scrolls programmatically; never sets #)
        // The data-anchor attribute (`el.dataset.anchor`) is set by the
        // Wix anchor-menu and section-navigator widgets — it's the
        // reliable signature we need.
        if (normalizePath(u.pathname) === normalizePath(location.pathname)) {
          var dataAnchor = (el.getAttribute('data-anchor') || el.dataset && el.dataset.anchor || '').toString();
          if (u.hash || dataAnchor) {
            var section;
            if (u.hash) {
              section = u.hash.replace(/^#/, '').slice(0, 200);
            } else if (anchor) {
              // Slugify the visible label so target_section is human-
              // readable ("accompagnement-immediat") rather than the
              // opaque Wix ID ("anchors-m6fkbsmm4").
              section = slugify(anchor) || dataAnchor.slice(0, 200);
            } else {
              section = dataAnchor.slice(0, 200);
            }
            lastClickAnchorAt = Date.now();
            send('cta_anchor_click', {
              target_section: section,
              anchor:         anchor,
              placement:      placementOf(el),
              source:         'click',
              data_anchor:    dataAnchor || null
            });
            return;
          }
        }
        if (isBookingTarget(u.pathname)) {
          var place = placementOf(el);
          send('cta_booking_click', {
            anchor:      anchor,
            placement:   place,
            target_path: normalizePath(u.pathname),
            href:        el.href
          });
        }
        return;
      }

      if (u.hostname) {
        send('click_outbound', {
          href:     el.href,
          hostname: u.hostname,
          anchor:   anchor
        });
      }
    } catch (err) {}
  }, true);

  // ==============================================================
  // 4c. Sticky-container click fallback for Wix anchor-menu widget
  //
  // Wix Studio's anchor menu renders as <button>/<div> elements that
  // scroll programmatically (no <a href="#x">, no hash update). Detect
  // them positionally: any click inside a sticky/fixed-positioned
  // container that wasn't already classified by the primary handler
  // (phone, booking, outbound) is treated as an anchor click. The
  // visible text becomes the `target_section`.
  //
  // Guards:
  //   - Skip if the primary handler just fired cta_anchor_click (<200ms)
  //   - Skip if the click is on a tel: / booking / outbound link
  //     (those are owned by the primary handler)
  //   - Skip if no text label can be extracted (avoids empty noise)
  // ==============================================================
  function slugify(s) {
    return String(s || '')
      .toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 200);
  }

  document.addEventListener('click', function (e) {
    if (Date.now() - lastClickAnchorAt < 200) return;

    var el = e.target;
    if (!el || el.nodeType !== 1) return;

    // Skip clicks the primary handler owns (tel:, booking, outbound).
    try {
      var aAncestor = el.closest('a[href]');
      if (aAncestor) {
        var href = aAncestor.getAttribute('href') || '';
        if (href.indexOf('tel:') === 0) return;
        if (href.indexOf('mailto:') === 0) return;
        var u2 = null;
        try { u2 = new URL(aAncestor.href); } catch (e2) {}
        if (u2 && u2.hostname && u2.hostname !== location.hostname) return;
        if (isBookingTarget((u2 && u2.pathname) || '')) return;
      }
    } catch (e3) {}

    // Must be inside a sticky/fixed container.
    var inSticky = false;
    try {
      var p = el, hops = 0;
      while (p && p !== document.body && hops < 15) {
        var pos = window.getComputedStyle(p).position;
        if (pos === 'sticky' || pos === 'fixed') { inSticky = true; break; }
        p = p.parentElement; hops++;
      }
    } catch (e4) {}
    if (!inSticky) return;

    // Find the closest interactive-like element to extract a label.
    var interactive = el;
    for (var i = 0; i < 6 && interactive && interactive.nodeType === 1; i++) {
      var tag = interactive.tagName;
      var role = interactive.getAttribute && interactive.getAttribute('role');
      if (tag === 'A' || tag === 'BUTTON' || role === 'button' || role === 'link') break;
      interactive = interactive.parentElement;
    }
    if (!interactive || interactive.nodeType !== 1) interactive = el;

    var label = (
      (interactive.getAttribute && interactive.getAttribute('aria-label')) ||
      interactive.textContent ||
      ''
    ).trim().slice(0, 100);
    if (!label) return;

    var slug = slugify(label);
    if (!slug) return;

    lastClickAnchorAt = Date.now();
    send('cta_anchor_click', {
      target_section: slug,
      anchor:         label,
      placement:      'sticky',
      source:         'sticky-fallback'
    });
  }, false); // bubble — primary capture-phase handler claims its own first

  // ==============================================================
  // 4b. Hashchange fallback for anchor menus
  //
  // Wix Studio's "anchor menu" widget (and similar custom-coded sticky
  // indices) scroll to a section by assigning location.hash via JS,
  // without dispatching a click on a real <a href="#x">. The click
  // handler above never sees those interactions. The DOM `hashchange`
  // event, however, fires unconditionally — so we use it as a catch-all.
  //
  // Dedup: if the click handler above just sent a cta_anchor_click in
  // the last 500 ms, skip this one to avoid double-counting.
  // ==============================================================
  var lastHash = location.hash || '';
  window.addEventListener('hashchange', function () {
    if (Date.now() - lastClickAnchorAt < 500) {
      lastHash = location.hash || '';
      return;
    }
    var newHash = location.hash || '';
    if (newHash === lastHash) return;
    lastHash = newHash;
    var section = newHash.replace(/^#/, '').slice(0, 200);
    if (!section) return;

    var anchor = null;
    var placement = 'unknown';
    if (lastClickedEl && lastClickedEl.nodeType === 1) {
      try {
        var src = lastClickedEl;
        // Walk up a couple of hops to find an element with an
        // accessible label (the actual click target is often a deep
        // inner <span> or <svg>).
        for (var i = 0; i < 4 && src && src.nodeType === 1; i++) {
          var lbl = src.getAttribute && (src.getAttribute('aria-label') || src.textContent);
          if (lbl && lbl.trim()) { anchor = lbl.trim().slice(0, 100); break; }
          src = src.parentElement;
        }
        placement = placementOf(lastClickedEl);
      } catch (e) {}
    }
    send('cta_anchor_click', {
      target_section: section,
      anchor:         anchor,
      placement:      placement,
      source:         'hashchange'
    });
  });

  // ==============================================================
  // 5. Core Web Vitals — LCP, CLS, INP, TTFB (p75 in SQL views)
  // ==============================================================
  var vitals         = { lcp: 0, cls: 0, inp: 0, ttfb: 0 };
  var vitalsEmitted  = { LCP: false, CLS: false, INP: false, TTFB: false };

  function emitVital(metric, value) {
    if (vitalsEmitted[metric]) return;
    vitalsEmitted[metric] = true;
    send('web_vitals', { metric: metric, value: Math.round(value * 100) / 100 });
  }

  // TTFB
  try {
    var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if (nav && nav.responseStart > 0) {
      vitals.ttfb = nav.responseStart;
      emitVital('TTFB', vitals.ttfb);
    }
  } catch (e) {}

  // LCP
  try {
    if (typeof PerformanceObserver !== 'undefined') {
      var lcpObs = new PerformanceObserver(function (list) {
        var entries = list.getEntries();
        if (entries.length) vitals.lcp = entries[entries.length - 1].startTime;
      });
      lcpObs.observe({ type: 'largest-contentful-paint', buffered: true });
    }
  } catch (e) {}

  var clsSessionValue   = 0;
  var clsSessionEntries = [];
  try {
    if (typeof PerformanceObserver !== 'undefined') {
      var clsObs = new PerformanceObserver(function (list) {
        list.getEntries().forEach(function (entry) {
          if (entry.hadRecentInput) return;
          var first = clsSessionEntries[0];
          var last  = clsSessionEntries[clsSessionEntries.length - 1];
          if (
            clsSessionValue &&
            entry.startTime - last.startTime < 1000 &&
            entry.startTime - first.startTime < 5000
          ) {
            clsSessionValue += entry.value;
            clsSessionEntries.push(entry);
          } else {
            clsSessionValue   = entry.value;
            clsSessionEntries = [entry];
          }
          if (clsSessionValue > vitals.cls) vitals.cls = clsSessionValue;
        });
      });
      clsObs.observe({ type: 'layout-shift', buffered: true });
    }
  } catch (e) {}

  try {
    if (typeof PerformanceObserver !== 'undefined') {
      var inpObs = new PerformanceObserver(function (list) {
        list.getEntries().forEach(function (entry) {
          if (entry.duration > vitals.inp) vitals.inp = entry.duration;
        });
      });
      inpObs.observe({ type: 'event', buffered: true, durationThreshold: 16 });
    }
  } catch (e) {}

  function flushVitals() {
    if (vitals.lcp)  emitVital('LCP', vitals.lcp);
    if (vitals.cls)  emitVital('CLS', vitals.cls);
    if (vitals.inp)  emitVital('INP', vitals.inp);
  }

  // ==============================================================
  // 6. Page exit — duration, max scroll, vitals flush
  // ==============================================================
  var exitSent = false;
  function flushExit() {
    if (exitSent) return;
    exitSent = true;

    if (activeMs > 0) {
      send('engagement_tick', { active_ms: activeMs });
      activeMs = 0;
    }
    flushVitals();

    var now2 = Date.now();
    if (!document.hidden && (now2 - lastActivity) < IDLE_THRESHOLD_MS) {
      totalActiveMs += (now2 - lastTick);
    }
    var duration = Math.round(totalActiveMs / 1000);
    send('page_exit', {
      duration_seconds: duration,
      max_scroll:       maxScroll
    });
  }

  function resetExitFlag() { exitSent = false; }
  window.addEventListener('popstate', resetExitFlag);

  window.addEventListener('pagehide',    flushExit);
  window.addEventListener('beforeunload', flushExit);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) flushExit();
  });
})();
</script>
